# Nginx site for thiyaneswaramma.org → Next.js on 127.0.0.1:3100
# Installed by deploy/setup-server.sh to /etc/nginx/sites-available/.
# Certbot (`certbot --nginx`) adds the HTTPS listeners and certificate lines.

upstream thiyaneswaramma_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.thiyaneswaramma.org;
    return 301 https://thiyaneswaramma.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name thiyaneswaramma.org;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed build assets never change — cache for a year.
    location /_next/static/ {
        proxy_pass http://thiyaneswaramma_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://thiyaneswaramma_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
