name: Deploy to VPS

# Runs on every push to main once you turn it on:
#   GitHub repo → Settings → Secrets and variables → Actions
#     Variables: DEPLOY_ENABLED = true
#     Secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY  (see docs/DEPLOY-VPS.md)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'sudo deploy-thiyaneswaramma'
